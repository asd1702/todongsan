services:
  market-service:
    environment:
      SPRING_PROFILES_ACTIVE: prod,resilience-lab
      INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN:-local-internal-token}
      RESILIENCE_LAB_MARKET_DELAY_MS: ${RESILIENCE_LAB_MARKET_DELAY_MS:-0}
      RESILIENCE_LAB_MARKET_STATUS_CODE: ${RESILIENCE_LAB_MARKET_STATUS_CODE:-0}

  insight-reputation-service:
    environment:
      SPRING_PROFILES_ACTIVE: docker,resilience-lab
      RESILIENCE_MARKET_CLIENT_ENABLED: ${RESILIENCE_MARKET_CLIENT_ENABLED:-true}
      MARKET_CLIENT_CONNECT_TIMEOUT_MS: ${MARKET_CLIENT_CONNECT_TIMEOUT_MS:-500}
      MARKET_CLIENT_READ_TIMEOUT_MS: ${MARKET_CLIENT_READ_TIMEOUT_MS:-1000}
