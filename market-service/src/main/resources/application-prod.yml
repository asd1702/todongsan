spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # useLocalSessionState: 읽기 전용 상태를 서버에 묻지 않는다 / rewriteBatchedStatements: JDBC batch를 묶어 보낸다 (ASYNC_POINT_FLOW.md §17.6)
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_MARKET}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useLocalSessionState=true&rewriteBatchedStatements=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

