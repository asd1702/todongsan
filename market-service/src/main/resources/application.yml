spring:
  application:
    name: market-service
  flyway:
    enabled: true
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
  profiles:
    default: local
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: market-service
      auto-offset-reset: earliest
      # 결과 반영 배치 크기 상한 (ASYNC_POINT_FLOW.md §16.1 Q4). poll은 도착한 만큼만 가져온다
      max-poll-records: ${KAFKA_MAX_POLL_RECORDS:100}
    listener:
      # 파티션 수(3)와 맞춘다. 실제 병렬도 = min(concurrency, 파티션 수) (ASYNC_POINT_FLOW.md §3.3)
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:3}
  cloud:
    openfeign:
      client:
        config:
          member-point-internal:
            connectTimeout: ${MEMBER_POINT_CONNECT_TIMEOUT_MILLIS:3000}
            readTimeout: ${MEMBER_POINT_READ_TIMEOUT_MILLIS:5000}
          insight-reputation-internal:
            connectTimeout: ${INSIGHT_CONNECT_TIMEOUT_MILLIS:3000}
            readTimeout: ${INSIGHT_READ_TIMEOUT_MILLIS:5000}

server:
  port: ${SERVER_PORT:8082}

client:
  member-point:
    mode: ${MEMBER_POINT_CLIENT_MODE:fake}
    base-url: ${MEMBER_POINT_SERVICE_URL:http://localhost:8080}
    connect-timeout-millis: ${MEMBER_POINT_CONNECT_TIMEOUT_MILLIS:3000}
    read-timeout-millis: ${MEMBER_POINT_READ_TIMEOUT_MILLIS:5000}
  insight:
    mode: ${INSIGHT_CLIENT_MODE:fake}
    base-url: ${INSIGHT_SERVICE_URL:http://localhost:8083}

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

market:
  point-transport:
    # sync: Feign 배치 호출 / async: outbox + Debezium CDC (현재 환불만 적용, docs/architecture/ASYNC_POINT_FLOW.md)
    mode: ${MARKET_POINT_TRANSPORT_MODE:sync}
    # async 요청 토픽(market.point-requests)의 Kafka key: member_id | market_id
    request-key: ${MARKET_POINT_REQUEST_KEY:member_id}
  kafka:
    point-results:
      # Member-Point 결과 이벤트 consumer. 전송 방식과 별도로 켠다 (sync로 되돌려도 이미 나간 요청의 결과는 반영해야 한다)
      enabled: ${MARKET_POINT_RESULTS_CONSUMER_ENABLED:false}
      topic: memberpoint.point-results
      # DB 장애(실패 직후 SELECT 1도 실패) 시 DLT 대신 기다린다. 한 번의 대기는 max.poll.interval.ms(5분)보다 짧아야 한다 (ASYNC_POINT_FLOW.md §16.1 Q3)
      db-unavailable:
        retry-interval-ms: ${MARKET_POINT_RESULTS_DB_RETRY_INTERVAL_MS:30000}
        max-wait-ms: ${MARKET_POINT_RESULTS_DB_MAX_WAIT_MS:3600000}
  scheduler:
    prediction-reconciliation:
      enabled: true
      fixed-delay-ms: 60000
      limit: 100
    settlement-retry:
      enabled: true
      fixed-delay-ms: 180000
      limit: 50
    refund-retry:
      enabled: true
      fixed-delay-ms: 180000
      limit: 50
    outbox-cleanup:
      enabled: ${MARKET_OUTBOX_CLEANUP_SCHEDULER_ENABLED:true}
      retention-days: 7
      batch-size: 1000
      max-batches: 10
      fixed-delay-ms: 3600000
    reputation-update:
      enabled: ${MARKET_REPUTATION_UPDATE_SCHEDULER_ENABLED:true}
      fixed-delay-ms: ${MARKET_REPUTATION_UPDATE_SCHEDULER_FIXED_DELAY_MS:180000}
      limit: ${MARKET_REPUTATION_UPDATE_SCHEDULER_LIMIT:50}
