spring:
  flyway:
    enabled: true
  datasource:
    url: ${MARKET_IT_DB_URL:jdbc:mysql://localhost:13308/market_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&rewriteBatchedStatements=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MARKET_IT_DB_USERNAME:market_test_user}
    password: ${MARKET_IT_DB_PASSWORD:market-test-local-password}
    hikari:
      maximum-pool-size: 60
      connection-timeout: 60000
  sql:
    init:
      mode: never

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

client:
  member-point:
    mode: fake
  insight:
    mode: fake

market:
  scheduler:
    prediction-reconciliation:
      enabled: false
    settlement-retry:
      enabled: false
    refund-retry:
      enabled: false
    reputation-update:
      enabled: false
