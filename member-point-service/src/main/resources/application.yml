spring:
  application:
    name: member-point-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      data-source-properties:
        # JDBC batch를 여러 행 INSERT 1회로 보낸다. 적립 배치의 DB 왕복을 줄인다 (ASYNC_POINT_FLOW.md §17.4 M3)
        rewriteBatchedStatements: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: member-point-service
      auto-offset-reset: earliest
      # 적립 배치 크기 상한. 배치 트랜잭션 동안 해당 회원 row가 잠기므로 spend 간섭과 함께 정한다 (ASYNC_POINT_FLOW.md §17.4 M7)
      max-poll-records: ${KAFKA_MAX_POLL_RECORDS:100}
    listener:
      # 파티션 수(3)와 맞춘다. 실제 병렬도 = min(concurrency, 파티션 수) (ASYNC_POINT_FLOW.md §3.3)
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:3}

member-point:
  kafka:
    market-point-requests:
      # Market outbox + CDC 비동기 포인트 요청 consumer (docs/architecture/ASYNC_POINT_FLOW.md)
      enabled: ${MARKET_POINT_REQUESTS_CONSUMER_ENABLED:false}
      # 업무 흐름별 토픽, listener도 토픽마다 따로 둔다 (ASYNC_POINT_FLOW.md §8.1 E5)
      refund-topic: market.refund-requests
      settlement-payout-topic: market.settlement-payout-requests
      # consumer 전용 DB 커넥션 풀 크기 (벌크헤드). spend 등 API 풀(spring.datasource.hikari, 기본 10)과 분리한다.
      # 동시에 도는 consumer thread 수(정산 지급 3 + 환불 3)와 맞춘다 (ASYNC_POINT_FLOW.md §17.7)
      pool-size: ${MARKET_POINT_REQUESTS_POOL_SIZE:6}
      # 적립 트랜잭션 1개의 최대 건수. 정산 지급 묶음(v2)은 이 크기로 나눠 처리한다 (ASYNC_POINT_FLOW.md §18.3 C3)
      max-batch-items: ${MARKET_POINT_REQUESTS_MAX_BATCH_ITEMS:100}
      # DB 장애(실패 직후 SELECT 1도 실패) 시 DLT 대신 기다린다. 한 번의 대기는 max.poll.interval.ms(5분)보다 짧아야 한다 (ASYNC_POINT_FLOW.md §16.1 Q3)
      db-unavailable:
        retry-interval-ms: ${MARKET_POINT_REQUESTS_DB_RETRY_INTERVAL_MS:30000}
        max-wait-ms: ${MARKET_POINT_REQUESTS_DB_MAX_WAIT_MS:3600000}
  outbox-cleanup:
    # point_outbox_event 보존 기간 경과 row 삭제 (ASYNC_POINT_FLOW.md §6.1 R7)
    enabled: ${POINT_OUTBOX_CLEANUP_SCHEDULER_ENABLED:true}
    retention-days: 7
    batch-size: 1000
    max-batches: 10
    fixed-delay-ms: 3600000

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: 21600000
  refresh-token-expiry: 5184000000

kakao:
  api-base-url: https://kapi.kakao.com

crypto:
  aes-key: ${CRYPTO_AES_KEY}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.todongsan.memberpointservice: DEBUG
    org.hibernate.SQL: DEBUG
    io.netty.resolver.dns.DnsServerAddressStreamProviders: OFF
